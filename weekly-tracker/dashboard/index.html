<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<script>try{var t=localStorage.getItem("aeo-dash-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>AI Visibility</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
/* Dark "monitoring" dashboard with a tabbed sidebar (see weekly-tracker/DESIGN.md).
   --brand / --brand-2 are replaced per client from its website colours. */
:root {
	--bg: #121212; --side: #0d0d0d; --card: #1e1e1e; --line: #2c2c2e; --hover: #252525; --chip: #252527;
	--ink: #ffffff; --muted: #98989d; --ink-2: #d6d6da;
	--brand: #00e5ff; --brand-2: #30d158; --brand-soft: rgba(0, 229, 255, 0.12); --on-brand: #0b0b0b;
	--good: #32d74b; --good-bg: #15301c; --bad: #ff453a; --bad-bg: #3a1c1c; --info-bg: #1c2733;
	--amber: #ff9f0a; --comp-1: #8e8e93; --comp-2: #636366; --comp-3: #48484a;
	--mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
	--sans: Inter, system-ui, -apple-system, sans-serif;
}
:root[data-theme="light"] {
	--bg: #f4f5f7; --side: #ffffff; --card: #ffffff; --line: #dfe2e7; --hover: #eef0f3; --chip: #e6e9ee;
	--ink: #16181d; --muted: #5e6470; --ink-2: #2b2f36;
	--good: #1a7f37; --good-bg: #e7f5ec; --bad: #c62828; --bad-bg: #fdecec; --info-bg: #eaf1fb;
	--amber: #b25e00; --comp-1: #8a8f98; --comp-2: #b4b8bf; --comp-3: #cfd2d7;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--brand); }
button { font: inherit; color: inherit; }

/* ---------- Shell: sidebar + main ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--side) 247px, var(--line) 247px, var(--line) 248px, transparent 248px); }
@media (max-width: 900px) { .shell { background: none; } }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 24px 16px; gap: 24px; }
.who { display: flex; gap: 12px; align-items: center; min-width: 0; padding: 0 8px; }
.who .name { font-weight: 600; font-size: 15px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .dom { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: #fff; display: grid; place-items: center; overflow: hidden; flex: none; border: 1px solid var(--line); }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.logo.initials { background: var(--brand); color: var(--on-brand); font: 700 15px var(--sans); }
nav.tabs { display: flex; flex-direction: column; gap: 4px; }
nav.tabs a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 15px; }
nav.tabs a svg { width: 18px; height: 18px; flex: none; }
nav.tabs a:hover { background: var(--hover); color: var(--ink); }
nav.tabs a[aria-current="page"] { background: var(--chip); color: var(--ink); }
nav.tabs a[aria-current="page"] svg { color: var(--brand); }
.side-foot { margin-top: auto; display: flex; gap: 8px; padding: 0 8px; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 18px; height: 18px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.topline h1 { margin: 0; }
.top-actions { display: flex; gap: 8px; }
.icon-btn.wide { width: auto; display: inline-flex; gap: 8px; justify-content: center; padding: 0 12px; font-size: 13px; font-weight: 500; }
@media (max-width: 480px) { .icon-btn.wide span { display: none; } .icon-btn.wide { width: 38px; padding: 0; } }
main { min-width: 0; padding: 32px 40px 64px; max-width: 1360px; }

@media (max-width: 900px) {
	.shell { grid-template-columns: minmax(0, 1fr); }
	.side { position: sticky; z-index: 5; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; gap: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
	.who { padding: 0; flex: 1; }
	.side-foot { margin: 0; padding: 0; }
	nav.tabs { order: 3; flex-direction: row; width: 100%; overflow-x: auto; gap: 4px; scrollbar-width: none; }
	nav.tabs a { white-space: nowrap; padding: 8px 12px; font-size: 14px; }
	main { padding: 24px 16px 48px; }
}

/* ---------- Page header + filter bar ---------- */
h1 { font: 600 28px/1.2 var(--sans); margin: 0 0 16px; letter-spacing: -0.01em; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.ranges { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ranges button, .pickbtn { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 14px; }
.ranges button:hover, .pickbtn:hover { color: var(--ink); }
.ranges button.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; box-shadow: inset 0 0 0 1px var(--brand); }
.pickers { display: flex; flex-wrap: wrap; gap: 8px; }
.pickbtn { display: inline-flex; align-items: center; gap: 8px; background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.pickbtn:hover { background: var(--hover); }
.pickbtn svg { width: 16px; height: 16px; }
.pickbtn.active { box-shadow: inset 0 0 0 1px var(--brand); color: var(--brand); }
.dd { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 220px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35); display: none; }
.menu.open { display: block; }
.menu.left { left: 0; right: auto; }
.menu label { display: block; color: var(--muted); font-size: 12px; margin: 8px 8px 4px; }
.menu button.opt { display: flex; width: 100%; justify-content: space-between; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
.menu button.opt:hover { background: var(--hover); }
.menu button.opt.on { color: var(--brand); }
.menu input[type="date"] { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px; font: inherit; color-scheme: inherit; }
.menu .apply { width: 100%; margin-top: 8px; border: 0; border-radius: 8px; padding: 8px; background: var(--brand); color: var(--on-brand); font-weight: 600; cursor: pointer; }
.period { color: var(--muted); font-size: 13px; margin: -12px 0 24px; }

/* ---------- Sections, cards, grid ---------- */
.sec { margin-bottom: 40px; }
.sec > h2 { font: 600 18px var(--sans); margin: 0 0 4px; }
.sec > .lead { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 1100px) { .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } .c3 { grid-column: span 6; } }
@media (max-width: 600px) { .c3 { grid-column: span 12; } }
.grid.top { align-items: start; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
.card h3 { font: 500 14px var(--sans); color: var(--muted); margin: 0 0 4px; display: flex; justify-content: space-between; gap: 8px; }
.card h3 small { font-weight: 400; font-size: 12px; }
.split { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); border: 1px solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; }
.split > div { padding: 20px; min-width: 0; }
.split > div + div { border-left: 1px solid var(--line); }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } .split > div + div { border-left: 0; border-top: 1px solid var(--line); } }
.big { font: 600 28px var(--sans); margin: 4px 0 16px; display: flex; gap: 10px; align-items: baseline; }
.big .d { font-size: 18px; }

/* KPI */
.kpi .val { font: 700 32px/1.1 var(--mono); margin: 8px 0; font-variant-numeric: tabular-nums; }
.kpi .val .unit { font-size: 18px; color: var(--muted); margin-left: 2px; }
.kpi .bar2 { height: 4px; border-radius: 2px; background: var(--line); margin: 12px 0 8px; overflow: hidden; }
.kpi .bar2 span { display: block; height: 100%; background: var(--brand); border-radius: 2px; }
.delta { font: 600 12px var(--mono); }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }

.chartbox { position: relative; height: 300px; }
.chartbox.short { height: 260px; }
.trend-empty { display: flex; gap: 16px; align-items: flex-start; padding: 24px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
.trend-empty svg { width: 28px; height: 28px; flex: none; color: var(--brand); }
.trend-empty b { color: var(--ink); font-weight: 600; }
.trend-empty p { margin: 4px 0 0; max-width: 60ch; }
.donut-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.donut-center .n { font: 700 28px/1 var(--mono); }
.donut-center .l { color: var(--muted); font-size: 11px; line-height: 1.35; margin: 4px auto 0; max-width: 112px; }
table.tight td { padding: 8px 6px; }
.sub2 { color: var(--muted); font-size: 12px; margin-left: 18px; }
.toggles { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; color: var(--muted); }
.toggles label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggles input { accent-color: var(--brand); width: 16px; height: 16px; }

/* Rank list */
.rank { list-style: none; margin: 8px 0 0; padding: 0; }
.rank li { display: grid; grid-template-columns: 24px 28px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rank li:last-child { border-bottom: 0; }
.rank .n { color: var(--muted); font-family: var(--mono); }
.rank .fav { width: 24px; height: 24px; border-radius: 6px; background: #fff; display: grid; place-items: center; overflow: hidden; font: 700 11px var(--sans); color: #333; }
.rank .fav img { width: 100%; height: 100%; object-fit: contain; }
.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.rank .dd2 { font-family: var(--mono); font-size: 13px; min-width: 56px; text-align: right; }
.owned { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-left: 8px; }

/* Alerts */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { padding: 12px 12px 12px 16px; border-radius: 8px; border-left: 4px solid; font-size: 13px; }
.alert b { display: block; font-weight: 600; margin-bottom: 2px; }
.alert.bad { background: var(--bad-bg); border-color: var(--bad); } .alert.bad b { color: var(--bad); }
.alert.good { background: var(--good-bg); border-color: var(--good); } .alert.good b { color: var(--good); }
.alert.info { background: var(--info-bg); border-color: var(--brand); } .alert.info b { color: var(--brand); }
.headline { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
.summary { color: var(--muted); margin: 0 0 16px; }

/* Tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--hover); }
tr.me td { background: var(--brand-soft); }
tr.me td:first-child { box-shadow: inset 3px 0 0 var(--brand); }
tr.click { cursor: pointer; }
tr.sel td { background: var(--chip); }
.tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-left: 8px; white-space: nowrap; }
.tag.me { border-color: var(--brand); color: var(--brand); }
.tag.p1 { border-color: var(--bad); color: var(--bad); } .tag.p2, .tag.dir { border-color: var(--amber); color: var(--amber); }
.pill { display: inline-flex; gap: 4px; }
.pill span { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 4px; background: var(--line); color: var(--muted); }
.pill span.yes { background: var(--brand-soft); color: var(--brand); }
.minibar { display: inline-block; width: 72px; height: 6px; background: var(--line); border-radius: 3px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.minibar span { display: block; height: 100%; background: var(--muted); }
tr.me .minibar span { background: var(--brand); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
ol.actions { margin: 0; padding-left: 20px; } ol.actions li { margin-bottom: 12px; } ol.actions li b { display: block; } ol.actions li span { color: var(--muted); }
ul.plain { margin: 0; padding-left: 18px; } ul.plain li { margin-bottom: 8px; }
.empty, .err { padding: 64px 16px; text-align: center; color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.6; }
.seg2 { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.seg2 button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.seg2 button.on { background: var(--card); color: var(--ink); }

/* Login */
.login { max-width: 420px; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 16px; }
.login h1 { font-size: 20px; margin: 0; }
.login form { display: flex; flex-direction: column; gap: 8px; }
.login input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: 15px var(--sans); padding: 12px; }
.login input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.login form button:disabled { opacity: 0.6; cursor: progress; }
.login form button { background: var(--brand); color: var(--on-brand); border: 0; border-radius: 8px; font: 600 15px var(--sans); padding: 12px; cursor: pointer; }
.login-wrap { padding: 0 16px; }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); width: min(880px, calc(100vw - 32px)); max-height: 85vh; padding: 0; }
dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
dialog .head { position: sticky; top: 0; background: var(--card); padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; }
dialog .body { padding: 20px; }
dialog pre { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.7 var(--sans); margin: 0 0 16px; color: var(--ink-2); }
dialog h4 { font: 600 14px var(--sans); margin: 16px 0 8px; }
dialog button.x { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
dialog hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<dialog id="detail"><div class="head"><strong id="d-title"></strong><button class="x" onclick="document.getElementById('detail').close()">Close</button></div><div class="body" id="d-body"></div></dialog>
<script src="app.js"></script>
</body>
</html>
